    <path fill="#231F20" d="M679,329.9h-49.3V441c0,8.6-0.9,14.5-2.8,17.9c-1.9,3.2-5.3,4.8-10.2,4.8c-4.8,0-8.2-1.7-10.2-5.2
      c-2-3.5-3-9.3-3-17.6v-111h-51.5v115.5c0,24.4,7.6,42.2,22.7,53.3c8.9,6.5,19.3,10.5,31.3,12.2L679,329.9z"/>
  </g>

