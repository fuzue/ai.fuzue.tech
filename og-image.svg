  <g transform="translate(900, 540) scale(0.24, 0.24) translate(-454, -250)">
    <path fill="#231F20" d="M853.3,255.7h51.5v197c0,11.3-1.8,20.4-5.3,27.4c-3.5,7.3-9.2,13.9-17.3,19.9c-10.9,7.9-24.1,11.8-39.6,11.8
      c-17.6,0-32.4-4.4-44.3-13.1c-15.1-11.1-22.7-28.9-22.7-53.3v-36.3L827,286.3v154.6c0,8.3,1,14.2,3,17.6s5.4,5.2,10.2,5.2
