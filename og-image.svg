<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <!-- Background -->
  <rect width="1200" height="630" fill="#fafaf9"/>

  <!-- Accent rule on the left -->
  <rect x="0" y="0" width="6" height="630" fill="#1a1a1a"/>

  <!-- Domain pill, top-right -->
  <text x="1140" y="56" text-anchor="end" font-size="22" fill="#666" font-weight="500" letter-spacing="0.04em">ai.fuzue.tech</text>

  <!-- Book title -->
  <text x="80" y="240" font-size="86" font-weight="700" fill="#1a1a1a" font-family="ui-serif, Georgia, 'Times New Roman', serif">AI: A Living Reference</text>

  <!-- Subtitle / tagline -->
  <text x="80" y="305" font-size="34" fill="#444" font-style="italic" font-family="ui-serif, Georgia, 'Times New Roman', serif">A research-oriented, continuously-updated reference for modern AI</text>

  <!-- Four-part divider -->
  <g transform="translate(80, 410)">
    <line x1="0" y1="0" x2="1040" y2="0" stroke="#d4d4d2" stroke-width="1"/>
  </g>

  <!-- Four part labels -->
  <g transform="translate(80, 460)" font-size="22" font-weight="700" fill="#1a1a1a" text-transform="uppercase" letter-spacing="0.06em">
    <text x="0"   y="0">Learning Foundations</text>
    <text x="260" y="0" fill="#444">Foundation Models</text>
    <text x="540" y="0" fill="#444">Behaviours · Alignment</text>
    <text x="860" y="0" fill="#444">Connections</text>
  </g>

  <!-- Light secondary line under the part labels -->
  <g transform="translate(80, 490)" font-size="18" fill="#777">
    <text x="0">deep learning · SSL · RL · theory</text>
    <text x="260">FM · LLMs · generative · multimodal</text>
    <text x="540">agents · interp · alignment · eval</text>
    <text x="860">causality · science · robotics</text>
  </g>

  <!-- Fuzue logo, bottom-right corner. Path copied from
