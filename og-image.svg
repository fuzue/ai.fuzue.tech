    <polygon fill="#231F20" points="1030.8,255.8 1018.3,308 975.6,308 975.6,328.6 1002.1,328.6 1002.1,380.8 975.6,380.8 975.6,455.9
      1030.8,455.9 1030.8,508 923.4,508.1 923.4,255.8 "/>
    <path fill="#231F20" d="M728.7,455.9l80.9-200.1l-350.5,0.1v254h51.7V434h20.5v-52.2h-20.5V308l209.3-0.1L638.5,508c0,0,85.8,0,133.8,0
